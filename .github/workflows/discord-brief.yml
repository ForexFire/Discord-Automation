name: Forex Fire Discord Briefs

on:
  schedule:
    # 08:00 UK while on BST (07:00 UTC)
    - cron: "0 7 * * 1-5"

    # 12:30 UK while on BST (11:30 UTC)
    - cron: "30 11 * * 1-5"

  workflow_dispatch:

jobs:
  forex-fire-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Forex Fire Discord Brief
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node discord-brief.js
