name: Forex Fire Discord Briefs

on:
  workflow_dispatch:
    inputs:
      brief_type:
        description: "Which Forex Fire brief do you want to send?"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - ny

jobs:
  forex-fire-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Determine brief type
        id: brief
        shell: bash
        run: |
          echo "type=${{ inputs.brief_type }}" >> "$GITHUB_OUTPUT"

      - name: Run Forex Fire Discord Brief
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIEF_TYPE: ${{ steps.brief.outputs.type }}
        run: node discord-brief.js
