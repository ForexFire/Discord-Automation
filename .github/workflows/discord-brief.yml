name: Forex Fire Discord Briefs

on:
  schedule:
    # 🔥 Sunday Week Ahead — 19:00 Europe/London
    - cron: "0 19 * * 0"
      timezone: "Europe/London"

    # ☕ Morning Brief — 08:07 Europe/London
    - cron: "7 8 * * 1-5"
      timezone: "Europe/London"

    # 🇬🇧 London Recap + 🇺🇸 NY Look Ahead — 12:30 Europe/London
    - cron: "30 12 * * 1-5"
      timezone: "Europe/London"

  workflow_dispatch:
    inputs:
      brief_type:
        description: "Which Forex Fire brief do you want to send?"
        required: true
        default: "morning"
        type: choice
        options:
          - week_ahead
          - morning
          - ny

jobs:
  forex-fire-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Determine brief type
        id: brief
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.brief_type }}" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event.schedule }}" = "0 19 * * 0" ]; then
            echo "type=week_ahead" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event.schedule }}" = "7 8 * * 1-5" ]; then
            echo "type=morning" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event.schedule }}" = "30 12 * * 1-5" ]; then
            echo "type=ny" >> "$GITHUB_OUTPUT"

          else
            echo "type=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Forex Fire Discord Brief
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIEF_TYPE: ${{ steps.brief.outputs.type }}
        run: node discord-brief.js
