name: Forex Fire Discord Briefs

on:
  schedule:
    # Morning Brief — 08:07 UK while on BST (07:07 UTC)
    - cron: "7 7 * * 1-5"

    # London Recap + NY Look Ahead — 12:30 UK while on BST (11:30 UTC)
    - cron: "30 11 * * 1-5"

  workflow_dispatch:
    inputs:
      brief_type:
        description: "Which Forex Fire brief do you want to send?"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - ny

jobs:
  forex-fire-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Determine brief type
        id: brief
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ inputs.brief_type }}" >> "$GITHUB_OUTPUT"

          elif [[ "${{ github.event.schedule }}" == "7 7 * * 1-5" ]]; then
            echo "type=morning" >> "$GITHUB_OUTPUT"

          elif [[ "${{ github.event.schedule }}" == "30 11 * * 1-5" ]]; then
            echo "type=ny" >> "$GITHUB_OUTPUT"

          else
            echo "Unknown trigger."
            exit 1
          fi

      - name: Run Forex Fire Discord Brief
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIEF_TYPE: ${{ steps.brief.outputs.type }}
        run: node discord-brief.js
